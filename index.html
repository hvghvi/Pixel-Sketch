<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="style.css">
    <title>Pixel Sketch</title>
</head>
<body>
    <main>
        <div class ="middle">
            <div class="menu-left">
                <h1 class ="title">PIXEL SKETCH</h1>
                <div class = "buttons">
                    <button id="user">set grid</button>
                    <button id="clear">clear grid</button>
                </div>
                <p>Shortcuts:</p>
                <p>g new grid, r reset grid, e eraser, c colour, d drag mode</p>
            </div>
            <div class="grid-wrap">
                <div class="container">
                    <div class="boxes"></div>
                </div>
                <div class="grid-controls">
                    <button id="eraser">eraser</button>
                    <button id="colour-btn">change colour</button>
                    <input type="color" id="colour-picker" value="#ffffff">
                    <button id="drag">drag: off</button>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>HUGH VIRGANIO 2026</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
